<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: #08090C; }
  #stage {
    width: 1080px; height: 1920px; position: relative; overflow: hidden;
    background: radial-gradient(96% 70% at 50% 22%, #2B2040 0%, #14111C 46%, #08090C 100%);
    font-family: "Segoe UI", system-ui, sans-serif; color: #F4F1EA;
  }
  .glow { position: absolute; left: 50%; top: 620px; width: 1200px; height: 1200px; margin-left: -600px;
    background: radial-gradient(circle, #F0A85022 0%, #F0A85000 58%); }
  .grid { position: absolute; inset: 0; opacity: 0.14;
    background-image: linear-gradient(#B9A7FF20 1px, transparent 1px), linear-gradient(90deg, #B9A7FF20 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: linear-gradient(180deg, #000 0%, transparent 60%);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 60%); }
  .grain { position: absolute; inset: 0; opacity: 0.5;
    background-image: radial-gradient(#ffffff10 0.6px, transparent 0.6px); background-size: 3px 3px; }
  header { position: absolute; left: 88px; right: 88px; top: 92px; text-align: center; }
  .kicker { font-size: 21px; letter-spacing: 8px; font-weight: 600; color: #B9A7FF; }
  h1 { margin: 20px 0 0 0; font-size: 74px; line-height: 1.0; letter-spacing: -1.8px; font-weight: 800; }
  h1 em { font-style: normal; color: #F0A850; }
  .sub { margin: 18px auto 0 auto; font-size: 27px; line-height: 1.35; color: #CFC9BF; max-width: 760px; }
  .frame { position: absolute; left: 190px; top: 372px; width: 700px; height: 1413px;
    border-radius: 38px; overflow: hidden; border: 2px solid #FFFFFF24;
    background: #0B0C10; box-shadow: 0 44px 90px #000000AA, inset 0 0 0 1px #FFFFFF0A; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sheen { position: absolute; inset: 0; border-radius: 36px; pointer-events: none;
    background: linear-gradient(160deg, #FFFFFF10 0%, #FFFFFF00 32%); }
  .foot { position: absolute; left: 0; right: 0; bottom: 60px; text-align: center;
    font-size: 21px; letter-spacing: 4px; color: #FFFFFF55; }
</style>
</head>
<body>
<div id="stage">
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="grain"></div>
  <header>
    <div class="kicker">3D STUDIO PRO · ANDROID</div>
    <h1 id="t1"></h1>
    <div class="sub" id="sub"></div>
  </header>
  <div class="frame"><img id="shot" alt="" /><div class="sheen"></div></div>
  <div class="foot">MODEL · RIG · ANIMATE · EXPORT</div>
</div>
<script>
  const cards = {
    hero: { img: "raw/hero.png", a: "A studio in", b: "your <em>pocket</em>",
      sub: "Model, rig and animate on a phone. Everything runs offline." },
    model: { img: "raw/model.png", a: "Model with", b: "real <em>precision</em>",
      sub: "Vertices, edges and faces, plus extrude, bevel, boolean and sculpt." },
    rig: { img: "raw/rig.png", a: "Rig in", b: "one <em>tap</em>",
      sub: "24-bone humanoid, weight painting, IK and constraints." },
    animate: { img: "raw/animate.png", a: "Animate,", b: "then <em>export</em>",
      sub: "Timeline, graph editor and game-ready GLB for Unity and Unreal." }
  };
  const id = new URLSearchParams(location.search).get("id") || "hero";
  const c = cards[id];
  document.getElementById("t1").innerHTML = c.a + "<br>" + c.b;
  document.getElementById("sub").textContent = c.sub;
  document.getElementById("shot").src = c.img;
</script>
</body>
</html>
